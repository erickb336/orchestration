name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # ORC-024 review M1: `npm test` regenerates the compiled principles first; a commit that changed
      # principles/*.md without the compiled copy fails here instead of shipping the old text.
      - name: The compiled principles match principles/*.md
        run: git diff --exit-code -- src/domain/builtInPrinciples.json
      - run: npm run build
      # ORC-027: the runtime-integration scenario (two concurrent workers, pause, resume, project pause, notes)
      # end to end through the real service, on the simulated runtime. `npm run test:real` runs it with real models.
      - name: Integration scenario (simulated runtime)
        run: npm run test:integration
