<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<title>Orchestrator hero</title>
<!--
  The README hero. scripts/capture-demo.mjs renders this page in Chrome at 2400×1350 and writes
  docs/media/hero.png. The screenshot comes from the query string: ?shot=<file URL of the Home capture>;
  without it, the committed Home screenshot is used, so the page can be opened on its own.
  The app's own dark tokens and system font stack; a quiet frame, no fake browser chrome. The frame runs
  off the bottom edge on purpose: the top of Home is what the hero shows.
-->
<style>
  :root {
    color-scheme: dark;
    --bg: #0c0d0f;
    --frame: #121315;
    --border: #2b2d31;
    --text: #ececea;
    --muted: #a3a6ad;
  }
  html, body { margin: 0; padding: 0; }
  body {
    width: 2400px;
    height: 1350px;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    position: relative;
    width: 2400px;
    height: 1350px;
    /* A faint cool light behind the screenshot, so the dark frame does not sink into the page. */
    background: radial-gradient(1400px 700px at 50% 85%, rgb(127 164 245 / 0.09), transparent 70%);
  }
  h1 {
    position: absolute; left: 128px; top: 120px; margin: 0;
    font-size: 116px; font-weight: 650; line-height: 1; letter-spacing: -0.025em;
  }
  p {
    position: absolute; left: 128px; top: 272px; margin: 0; max-width: 2100px;
    font-size: 46px; font-weight: 450; line-height: 1.3; color: var(--muted);
  }
  .frame {
    position: absolute; left: 128px; top: 440px; width: 2144px; height: 1340px;
    border-radius: 14px; border: 2px solid var(--border); background: var(--frame);
    overflow: hidden;
    box-shadow: 0 0 0 1px rgb(0 0 0 / 0.6), 0 32px 96px rgb(0 0 0 / 0.55);
  }
  .frame img { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Orchestrator</h1>
    <p>One lead. Claude and Codex agents. Every step visible, pausable and yours to steer.</p>
    <div class="frame"><img id="shot" src="../../docs/screenshots/home.png" alt="Home in the sample project"></div>
  </div>
  <script>
    const shot = new URLSearchParams(location.search).get("shot");
    if (shot) document.getElementById("shot").src = shot;
  </script>
</body>
</html>
