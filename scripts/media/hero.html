<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orchestrator hero</title>
<!--
  ORC-017 §6: the README hero. scripts/capture-demo.mjs renders this page in Chrome at 2400×1350 and writes
  docs/media/hero.png. The screenshot comes from the query string: ?shot=<file URL of the Overview capture>;
  without it, the committed Overview screenshot is used, so the page can be opened on its own.
  Black and white only, the app's own tokens and system font stack; a quiet frame, no fake browser chrome.
-->
<style>
  :root {
    --bg: #f6f6f4;
    --surface: #ffffff;
    --border: #e4e4e0;
    --text: #111111;
    --muted: #5f5f5b;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.05), 0 2px 8px rgb(0 0 0 / 0.04);
  }
  html, body { margin: 0; padding: 0; }
  body {
    width: 2400px;
    height: 1350px;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { position: relative; width: 2400px; height: 1350px; }
  h1 {
    position: absolute; left: 128px; top: 128px; margin: 0;
    font-size: 116px; font-weight: 650; line-height: 1; letter-spacing: -0.025em;
  }
  p {
    position: absolute; left: 128px; top: 284px; margin: 0; max-width: 2100px;
    font-size: 46px; font-weight: 450; line-height: 1.3; color: var(--muted);
  }
  .frame {
    position: absolute; left: 128px; top: 452px; width: 2144px; height: 1340px;
    border-radius: 12px; border: 1px solid var(--border); background: var(--surface);
    overflow: hidden;
    box-shadow: var(--shadow), 0 24px 64px rgb(0 0 0 / 0.08);
  }
  .frame img { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Orchestrator</h1>
    <p>One lead. Claude and Codex workers. Every step visible, pausable and yours to steer.</p>
    <div class="frame"><img id="shot" src="../../docs/screenshots/overview.png" alt="The Overview of the sample project"></div>
  </div>
  <script>
    const shot = new URLSearchParams(location.search).get("shot");
    if (shot) document.getElementById("shot").src = shot;
  </script>
</body>
</html>
