<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trip board</title>
    <style>
      body { margin: 0; font: 16px/1.4 sans-serif; background: #f6f4ef; color: #1d1d1b; }
      header { padding: 16px 24px; background: #1f4d3a; color: #fff; }
      main { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; padding: 24px; }
      .card { background: #fff; border-radius: 8px; padding: 16px; box-shadow: 0 1px 3px rgb(0 0 0 / 0.15); }
    </style>
  </head>
  <body>
    <header><h1>Trip board</h1></header>
    <main>
      <section class="card"><h2>Lake weekend</h2><p>4 going · 12–14 June</p></section>
      <section class="card"><h2>City break</h2><p>3 going · 3–5 July</p></section>
      <section class="card"><h2>Coast walk</h2><p>5 going · 21–23 August</p></section>
    </main>
  </body>
</html>
