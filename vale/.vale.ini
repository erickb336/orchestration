# Orchestrator's check of controlled English: about 80% of ASD-STE100 (principles/write-controlled-english.md).
# Vale 3.24.0 (MIT). The service runs it on the lead's text (server/prose/); `npm run lint:prose` runs it on the
# owner's documents. Errors are few and certain; warnings guide (docs/design/ORC-029-pass4d-design.md, decision 5).
#
# The rules (vale/styles/STE80, each with its own good and bad samples: `vale test styles/STE80` from this folder):
# - error: a sentence over 35 words (SentenceLength);
# - warning: a sentence of 26 to 35 words (SentenceLong), a paragraph of more than 6 sentences (ParagraphLength),
#   the passive voice (Passive), a vague word (Vague).
# Not checked here, so the principle carries them:
# - noun clusters: Vale's part-of-speech tagger found none of five clusters of 4 or 5 nouns in samples, and every
#   alert it gave on the lead's real text was wrong (measured 2026-10-02);
# - one instruction per sentence, and a missing "the", "a" or "an": no tool checks them well (the design, "Not in
#   this pass").
# A word the project's dictionary says to avoid is an error too: server/prose/words.ts generates that style (Project)
# from the approved dictionary into the service's data folder, with a copy of this configuration that adds it (4d-2).
StylesPath = styles
MinAlertLevel = warning

[*.md]
BasedOnStyles = STE80
